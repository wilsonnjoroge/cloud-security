name: Terraform Apply

on:
  workflow_dispatch:
    inputs:
      project:
        description: 'Which project to apply'
        required: true
        type: choice
        options:
          - vpc-lab
      target_environment:
        description: 'Which environment to deploy to'
        required: true
        type: choice
        options:
          - dev
          - uat
          - preprod
          - prod

permissions:
  id-token: write   # required to request a GitHub OIDC token
  contents: read

jobs:
  # ---------------------------------------------------------------------
  # Job 1: runs immediately, unattended, no approval gate. Its only job
  # is to compute a fresh, real plan and show its cost, so a reviewer
  # has something real to look at BEFORE approving job 2. A job that
  # carries `environment:` pauses before its first step runs at all --
  # approving that blind (nothing computed yet) defeats the point of a
  # review gate. This job exists specifically so that isn't the case.
  # ---------------------------------------------------------------------
  plan-and-estimate:
    runs-on: ubuntu-latest
    outputs:
      project-dir: ${{ steps.project-dir.outputs.dir }}
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Map project input to working directory
        id: project-dir
        run: |
          case "${{ inputs.project }}" in
            vpc-lab)
              echo "dir=terraform-iac/aws-provisions/vpc-lab" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Unknown project: ${{ inputs.project }}"
              exit 1
              ;;
          esac

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::025066283316:role/github-actions-terraform-apply
          aws-region: us-east-1

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: ${{ steps.project-dir.outputs.dir }}
        run: terraform init -input=false

      - name: Terraform Plan (fresh, against current real state)
        id: plan
        working-directory: ${{ steps.project-dir.outputs.dir }}
        run: terraform plan -no-color -input=false -out=tfplan
        env:
          TF_VAR_my_ip_cidr: ${{ secrets.TF_VAR_MY_IP_CIDR }}

      - name: Show plan summary in job log
        working-directory: ${{ steps.project-dir.outputs.dir }}
        run: terraform show -no-color tfplan

      - name: Cost estimate
        if: steps.plan.outcome == 'success'
        working-directory: ${{ steps.project-dir.outputs.dir }}
        run: |
          if command -v infracost >/dev/null 2>&1; then
            infracost breakdown --path=tfplan
          else
            echo "Infracost not installed on this runner -- skipping cost estimate."
            echo "To enable: add setup-infracost action + INFRACOST_API_KEY secret."
          fi

      - name: Upload plan as artifact for the apply job to consume
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ inputs.target_environment }}
          path: ${{ steps.project-dir.outputs.dir }}/tfplan
          retention-days: 1

  # ---------------------------------------------------------------------
  # Job 2: this is the one gated by GitHub Environment protection rules
  # (required reviewers). By the time a reviewer is asked to approve,
  # job 1's log already shows the real plan and its cost -- approval is
  # informed, not blind. This job never recomputes the plan; it applies
  # exactly the artifact job 1 already produced.
  # ---------------------------------------------------------------------
  apply:
    needs: plan-and-estimate
    runs-on: ubuntu-latest
    environment: ${{ inputs.target_environment }}
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Download plan artifact from plan-and-estimate
        uses: actions/download-artifact@v4
        with:
          name: tfplan-${{ inputs.target_environment }}
          path: ${{ needs.plan-and-estimate.outputs.project-dir }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::025066283316:role/github-actions-terraform-apply
          aws-region: us-east-1

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: ${{ needs.plan-and-estimate.outputs.project-dir }}
        run: terraform init -input=false

      - name: Terraform Apply (applies the exact plan from job 1, nothing recomputed)
        working-directory: ${{ needs.plan-and-estimate.outputs.project-dir }}
        run: terraform apply -input=false -auto-approve tfplan

      - name: Upload private key as artifact
        uses: actions/upload-artifact@v4
        with:
          name: ssh-key
          path: ${{ needs.plan-and-estimate.outputs.project-dir }}/lab2-key.pem
          retention-days: 1
          # Short retention deliberately: this key is only ever needed
          # right after this specific apply run. GitHub artifacts are not
          # a real secrets store -- anyone with read access to this repo's
          # Actions runs can download it during the 1-day window. For
          # anything beyond quick manual access, push it to AWS Secrets
          # Manager instead of relying on artifact retention.