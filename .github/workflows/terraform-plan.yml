name: Terraform Plan

on:
  pull_request:
    # No paths filter -- same reasoning as fmt-validate.yml and
    # terraform-security-scan.yml. Always triggers, checks internally
    # whether there's anything Terraform-related to plan, so it can be
    # safely marked "required" in branch protection without risking a
    # permanently-pending check on non-Terraform PRs.

permissions:
  id-token: write   # required to request a GitHub OIDC token
  contents: read
  pull-requests: write   # required to post the plan output as a PR comment

jobs:
  plan:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        working-directory:
          - terraform-iac/aws-provisions/vpc-lab
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for .tf changes in this project
        id: tf-changes
        run: |
          BASE_REF="origin/${{ github.event.pull_request.base.ref }}"
          DIR="${{ matrix.working-directory }}"
          if git diff --name-only "$BASE_REF"...HEAD -- "$DIR" | grep -q '\.tf$'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure AWS credentials (OIDC)
        if: steps.tf-changes.outputs.changed == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::025066283316:role/github-actions-terraform-plan
          aws-region: us-east-1

      - name: Set up Terraform
        if: steps.tf-changes.outputs.changed == 'true'
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        if: steps.tf-changes.outputs.changed == 'true'
        working-directory: ${{ matrix.working-directory }}
        run: terraform init -input=false

      - name: Terraform Plan
        if: steps.tf-changes.outputs.changed == 'true'
        id: plan
        working-directory: ${{ matrix.working-directory }}
        run: terraform plan -no-color -input=false
        continue-on-error: true
        env:
          # -input=false above means: never prompt interactively, fail
          # fast instead if a required variable is missing. Any variable
          # with no default in variables.tf (e.g. my_ip_cidr) has to be
          # supplied here explicitly -- CI has no terminal to type an
          # answer into, unlike a local `terraform plan` run.
          TF_VAR_my_ip_cidr: ${{ secrets.TF_VAR_MY_IP_CIDR }}

      - name: Comment plan output on PR
        if: steps.tf-changes.outputs.changed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const output = `#### Terraform Plan: \`${{ matrix.working-directory }}\`
            \`\`\`
            ${{ steps.plan.outputs.stdout }}
            \`\`\`
            `;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            });

      - name: Fail job if plan failed
        if: steps.tf-changes.outputs.changed == 'true' && steps.plan.outcome == 'failure'
        run: exit 1

      - name: No Terraform changes -- nothing to plan
        if: steps.tf-changes.outputs.changed == 'false'
        run: echo "No .tf changes in ${{ matrix.working-directory }} -- skipping plan, reporting success."